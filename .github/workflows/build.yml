name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        env:
      - uses: pnpm/action-setup@v5
        env:
        with:
          version: 9.15.4
      - uses: actions/setup-node@v5
        env:
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @lovable-migrator/scanner build
      - run: pnpm --filter @lovable-migrator/dashboard build
